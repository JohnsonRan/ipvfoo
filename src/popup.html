<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
html,
body {
  overflow: visible;
  scrollbar-width: none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}
body {
  margin: 0;
  padding: 10px 14px 10px 10px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  background-color: #f6f8fa;
  color: #1f2328;
  box-sizing: border-box;
}
/* We want copy-paste to keep the domain in the first column,
   so this draws a vertical line to fake the "zeroth" column. */
table {
  --cache-min-width: 0px;
  border: 1px solid #e1e4e8;
  border-radius: 8px;
  border-spacing: 0;
  box-shadow: 0 2px 8px rgba(140, 149, 159, 0.12);
  overflow: hidden;
}
td, tr {
  border-width: 0;
  border-collapse: separate;
  border-color: #eaecef;
  border-style: solid;
  padding: 6px 10px;
  white-space: nowrap;
  user-select: none;
}
tr {
  height: 30px;
}
tr + tr td {
  border-top-width: 1px;
}
tr:hover {
  background-color: #f3f6fb;
}
img {
  user-select: none;
  vertical-align: -3px;
}
::selection {
  background-color: #b6e3ff;
}
.mainRow {
  font-weight: bold;
  background-color: #fff;
}
.sslImg {
  padding-right: 6pt;
}
.domainTd {
  user-select: text;
  cursor: text;
}
.addrTd {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  border-right-width: 0;
  color: #0969da;
  min-width: 18ch;
  padding-right: 0;
  user-select: text;
  cursor: text;
}
.cacheTd {
  border-left-width: 0;
  text-align: right;
  min-width: var(--cache-min-width);
}
.cacheTd img {
  opacity: 0.72;
}
.geoTd {
  font-size: 12px;
  color: #57606a;
  padding-left: 6pt;
  padding-right: 6pt;
  border-left-width: 0;
  border-right-width: 0;
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.geoRefreshable {
  cursor: pointer;
}
.geoRefreshable:focus-visible,
#options_link:focus-visible {
  outline: 2px solid #0969da;
  outline-offset: 1px;
  border-radius: 4px;
}
.geoPending::after {
  content: "";
  display: inline-block;
  width: 34px;
  height: 7px;
  border-radius: 999px;
  background: linear-gradient(90deg, #d0d7de, #f6f8fa, #d0d7de);
  background-size: 200% 100%;
  animation: geoPulse 1.2s ease-in-out infinite;
}
.countTd,
.statusTd {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  color: #57606a;
  text-align: right;
  border-left-width: 0;
  border-right-width: 0;
  min-width: 24px;
  padding-left: 4pt;
  padding-right: 4pt;
}
.countTd {
  color: #6e7781;
}
.statusTd.errorStatus {
  color: #cf222e;
  font-weight: 600;
}
.timingTd {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  color: #57606a;
  text-align: right;
  border-left-width: 0;
  max-width: 95px;
}
.ip4 {
  color: #bc4c00;
}
.ip6 {
  color: #1a7f37;
}
.highlight {
  background-color: #fff8c5;
}
.border {
  display: inline-block;
}

.snippedTextInvisible {
  /* When JS removes this style, the snipped text becomes visible. */
  position: absolute;
  overflow: hidden;
  width: 1px;
  color: transparent;
}
.snipLinkInvisible {
  display: none;
}
.snipLinkVisible {
  /* When JS removes this style, the link becomes invisible. */
  display: inline;
}
.snipImg {
  /* Prevent Firefox 'Ctrl-A Ctrl-C' from inserting a line break. */
  user-select: text;
}

#beg {
  display: none;
  margin-bottom: 10px;
  padding: 8px 10px;
  width: 100%;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  background: #fff;
  color: #0969da;
  font: inherit;
}
#spill_count_container {
  text-align: center;
  font-weight: 600;
  color: #6e7781;
  margin-top: 8px;
}
#popup_footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
#options_link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: #6e7781;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
}
#options_link:hover {
  color: #0969da;
  text-decoration: underline;
}
#options_gear {
  font-size: 13px;
  line-height: 1;
}
.metaTooltip {
  position: fixed;
  z-index: 10;
  display: none;
  max-width: 240px;
  padding: 6px 9px;
  border: 1px solid #e1e4e8;
  border-radius: 6px;
  background: #ffffff;
  color: #1f2328;
  box-shadow: 0 4px 14px rgba(140, 149, 159, 0.28);
  font-size: 12px;
  line-height: 1.5;
  white-space: pre;
  pointer-events: none;
}
.metaTooltip.visible {
  display: block;
}
.statusBadge {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 999px;
  background: #ffebe9;
  color: #cf222e;
  font-size: 11px;
  font-weight: 600;
  vertical-align: 1px;
}
.geoStateTd {
  font-size: 12px;
  color: #57606a;
  padding-left: 6pt;
  border-left-width: 0;
  border-right-width: 0;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.geoStateTd .stateImg {
  opacity: 0.6;
  margin-left: 6px;
}

/* dark mode */
@media (prefers-color-scheme: dark) {
  body {
    background-color: #0d1117;
    color: #e6edf3;
  }
  ::selection {
    background-color: #1f6feb;
  }
  table {
    border-color: #2a2f37;
    box-shadow: 0 2px 8px rgba(1, 4, 9, 0.4);
  }
  td, tr {
    border-color: #21262d;
  }
  tr:hover {
    background-color: #161b22;
  }
  .mainRow {
    background-color: #161b22;
  }
  .sslImg {
    filter: invert(1);
  }
  .snipImg {
    filter: invert(1);
  }
  .addrTd {
    color: #79c0ff;
  }
  .ip4 {
    color: #ffa657;
  }
  .ip6 {
    color: #7ee787;
  }
  .highlight {
    background-color: #3b3200;
  }
  .geoTd {
    color: #8b949e;
  }
  .countTd,
  .statusTd {
    color: #8b949e;
  }
  .statusTd.errorStatus {
    color: #ff7b72;
  }
  .timingTd {
    color: #8b949e;
  }
  .geoPending::after {
    background: linear-gradient(90deg, #30363d, #161b22, #30363d);
    background-size: 200% 100%;
  }
  #beg {
    background: #161b22;
    border-color: #30363d;
    color: #79c0ff;
  }
  #spill_count_container {
    color: #8b949e;
  }
  #options_link {
    color: #8b949e;
  }
  #options_link:hover {
    color: #79c0ff;
  }
  .geoRefreshable:focus-visible,
  #options_link:focus-visible {
    outline-color: #1f6feb;
  }
  .metaTooltip {
    border-color: #30363d;
    background: #161b22;
    color: #e6edf3;
    box-shadow: 0 4px 14px rgba(1, 4, 9, 0.5);
  }
  .statusBadge {
    background: #3a1d1d;
    color: #ff7b72;
  }
  .geoStateTd {
    color: #8b949e;
  }
}

@keyframes geoPulse {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}

@keyframes shake {
  from, to {
    transform: translate3d(0, 0, 0);
  }
  20%, 60% {
    transform: translate3d(5px, 0, 0);
  }
  40%, 80% {
    transform: translate3d(-5px, 0, 0);
  }
}
.shake {
  animation-name: shake;
  animation-duration: 500ms;
}

</style>
<script type="text/javascript" src="iputil.js"></script>
<script type="text/javascript" src="common.js"></script>
<script type="text/javascript" src="popup.js"></script>
</head>
<body>
<div class="border">
  <div id="meta_tooltip" class="metaTooltip" role="tooltip" aria-hidden="true"></div>
  <button id="beg">Click to grant permission</button>
  <table id="addr_table" height="1px"></table>
  <div id="spill_count_container">
  &#x22ee; <span id="spill_count">0</span> requests omitted
  </div>
  <div id="popup_footer">
    <a id="options_link" href="#" title="Open IPvFoo options">
      <span id="options_gear">&#x2699;&#xFE0E;</span><span>Options</span>
    </a>
  </div>
</div>
</body>
</html>
