<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
html,
body {
  overflow: visible;
  scrollbar-width: none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
}
body {
  margin: 0;
  padding: 10px 14px 10px 10px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  background-color: #f6f8fa;
  color: #1f2328;
  box-sizing: border-box;
}
/* We want copy-paste to keep the domain in the first column,
   so this draws a vertical line to fake the "zeroth" column. */
table {
  --cache-min-width: 0px;
  background-image: linear-gradient(to right, transparent 0 27px, #d0d7de 27px 28px, transparent 28px);
  border: 1px solid #d0d7de;
  border-radius: 8px;
  border-spacing: 0;
  box-shadow: 0 8px 24px rgba(140, 149, 159, 0.18);
  overflow: hidden;
}
td, tr {
  border-width: 0;
  border-collapse: separate;
  border-color: #d0d7de;
  border-style: solid;
  padding: 4px 8px;
  white-space: nowrap;
  user-select: none;
}
tr {
  height: 28px;
}
tr + tr td {
  border-top-width: 1px;
}
tr:hover {
  background-color: #eef6ff;
}
img {
  user-select: none;
  vertical-align: -3px;
}
::selection {
  background-color: #b6e3ff;
}
.mainRow {
  font-weight: bold;
  background-color: #fff;
}
.sslImg {
  padding-right: 6pt;
}
.domainTd {
  user-select: text;
  cursor: text;
}
.addrTd {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  border-right-width: 0;
  color: #0969da;
  padding-right: 0;
  user-select: text;
  cursor: text;
}
.cacheTd {
  border-left-width: 0;
  text-align: right;
  min-width: var(--cache-min-width);
}
.cacheTd img {
  opacity: 0.72;
}
.geoTd {
  font-size: 12px;
  color: #57606a;
  padding-left: 6pt;
  padding-right: 6pt;
  border-left-width: 0;
  border-right-width: 0;
  max-width: 170px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.geoPending::after {
  content: "";
  display: inline-block;
  width: 34px;
  height: 7px;
  border-radius: 999px;
  background: linear-gradient(90deg, #d0d7de, #f6f8fa, #d0d7de);
  background-size: 200% 100%;
  animation: geoPulse 1.2s ease-in-out infinite;
}
.countTd,
.statusTd {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  color: #57606a;
  text-align: right;
  border-left-width: 0;
  border-right-width: 0;
  min-width: 24px;
  padding-left: 4pt;
  padding-right: 4pt;
}
.countTd {
  color: #6e7781;
}
.statusTd.errorStatus {
  color: #cf222e;
  font-weight: 600;
}
.timingTd {
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  color: #57606a;
  text-align: right;
  border-left-width: 0;
  max-width: 95px;
}
.ip4 {
  color: #bc4c00;
}
.ip6 {
  color: #1a7f37;
}
.highlight {
  background-color: #fff8c5;
}
.border {
  display: inline-block;
}

.snippedTextInvisible {
  /* When JS removes this style, the snipped text becomes visible. */
  position: absolute;
  overflow: hidden;
  width: 1px;
  color: transparent;
}
.snipLinkInvisible {
  display: none;
}
.snipLinkVisible {
  /* When JS removes this style, the link becomes invisible. */
  display: inline;
}
.snipImg {
  /* Prevent Firefox 'Ctrl-A Ctrl-C' from inserting a line break. */
  user-select: text;
}

#beg {
  display: none;
  margin-bottom: 10px;
  padding: 8px 10px;
  width: 100%;
  border: 1px solid #d0d7de;
  border-radius: 6px;
  background: #fff;
  color: #0969da;
  font: inherit;
}
#spill_count_container {
  text-align: center;
  font-weight: 600;
  color: #6e7781;
  margin-top: 8px;
}
#mobile_footer {
  display: none; /* or flex */
  justify-content: space-between;
  align-items: center;
}
#options_link {
  padding-top: 16px;
  padding-bottom: 14px;
  flex: 1;
  font-size: 14px;
  text-align: center;
}
#options_link a {
  color: #57606a;
}
#pattern_icon_lightfg {
  display: none;
}

#lookup_bubble {
  --bubble-fg: #1f2328;
  --bubble-left: 0px;
  --table-left: 0px;
  --table-width: 0px;
  --bubble-width: 0px;
  --max-left: calc(var(--table-left) + var(--table-width) - var(--bubble-width));
  position: absolute;
  display: none;
  background: #fff;
  border: 1px solid #d0d7de;
  border-radius: 8px;
  box-sizing: border-box;
  box-shadow: 0 8px 24px rgba(140, 149, 159, 0.24);
  left: clamp(var(--table-left), var(--bubble-left), var(--max-left));
  max-width: var(--table-width);
}
#lookup_bubble::before {
  /* arrow pointing up from the border. */
  --arrow-size: 5px;
  content: "";
  position: absolute;
  top: calc(-1 * var(--arrow-size));
  left: calc(var(--bubble-left) - min(var(--bubble-left), var(--max-left)) + 10px);
  width: 0;
  height: 0;
  border-left: var(--arrow-size) solid transparent;
  border-right: var(--arrow-size) solid transparent;
  border-bottom: var(--arrow-size) solid #d0d7de;
}
#lookup_bubble a {
  display: block;
  padding: 8px 10px;
  color: var(--bubble-fg);
  text-decoration: none;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
#lookup_bubble a::-webkit-scrollbar {
  display: none;
}
#lookup_bubble a:hover {
  background-color: #f6f8fa;
}

/* dark mode */
@media (prefers-color-scheme: dark) {
  body {
    background-color: #0d1117;
    color: #e6edf3;
  }
  ::selection {
    background-color: #1f6feb;
  }
  table {
    background-image: linear-gradient(to right, transparent 0 27px, #30363d 27px 28px, transparent 28px);
    border-color: #30363d;
    box-shadow: 0 8px 24px rgba(1, 4, 9, 0.35);
  }
  td, tr {
    border-color: #30363d;
  }
  tr:hover {
    background-color: #161b22;
  }
  .mainRow {
    background-color: #161b22;
  }
  .sslImg {
    filter: invert(1);
  }
  .snipImg {
    filter: invert(1);
  }
  .addrTd {
    color: #79c0ff;
  }
  .ip4 {
    color: #ffa657;
  }
  .ip6 {
    color: #7ee787;
  }
  .highlight {
    background-color: #3b3200;
  }
  .geoTd {
    color: #8b949e;
  }
  .countTd,
  .statusTd {
    color: #8b949e;
  }
  .statusTd.errorStatus {
    color: #ff7b72;
  }
  .timingTd {
    color: #8b949e;
  }
  .geoPending::after {
    background: linear-gradient(90deg, #30363d, #161b22, #30363d);
    background-size: 200% 100%;
  }
  #beg {
    background: #161b22;
    border-color: #30363d;
    color: #79c0ff;
  }
  #spill_count_container,
  #options_link a {
    color: #8b949e;
  }
  #pattern_icon_darkfg {
    display: none;
  }
  #pattern_icon_lightfg {
    display: initial;
  }
  #lookup_bubble {
    background: #161b22;
    border-color: #30363d;
    box-shadow: 0 8px 24px rgba(1, 4, 9, 0.45);
    --bubble-fg: #e6edf3;
  }
  #lookup_bubble::before {
    border-bottom-color: #30363d;
  }
  #lookup_bubble a:hover {
    background-color: #0d1117;
  }
}

@keyframes geoPulse {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}

@keyframes shake {
  from, to {
    transform: translate3d(0, 0, 0);
  }
  20%, 60% {
    transform: translate3d(5px, 0, 0);
  }
  40%, 80% {
    transform: translate3d(-5px, 0, 0);
  }
}
.shake {
  animation-name: shake;
  animation-duration: 500ms;
}

</style>
<script type="text/javascript" src="iputil.js"></script>
<script type="text/javascript" src="common.js"></script>
<script type="text/javascript" src="popup.js"></script>
</head>
<body>
<div class="border">
  <button id="beg">Click to grant permission</button>
  <table id="addr_table" height="1px"></table>
  <div id="spill_count_container">
  &#x22ee; <span id="spill_count">0</span> requests omitted
  </div>
  <div id="mobile_footer">
    <div id="options_link"><a href="options.html">Options</a></div>
    <img id="pattern_icon_lightfg">
    <img id="pattern_icon_darkfg">
  </div>
  <div id="lookup_bubble">
    <a id="lookup_link" href="#" target="_blank">Lookup on lookup.example.com</a>
  </div>
</div>
</body>
</html>
